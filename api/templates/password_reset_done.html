{% extends 'base.html' %}
{% load static %}
{% block title %}Check your email — CyberSpark{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/password-reset.css' %}">
{% endblock %}
{% block content %}
<div class="pwreset-wrap">
  <div class="pwreset-card pwreset-center">
    <span class="pwreset-icon" style="margin-left:auto; margin-right:auto;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>
    </span>
    <h1>Check your email</h1>
    <p>If an account exists for that address, we've sent a link to reset your password.</p>
    <a href="{% url 'login' %}" class="btn-primary">Back to Sign In</a>
  </div>
</div>
{% endblock %}
