<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Something went wrong — CyberSpark</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
(function(){var t;try{t=localStorage.getItem('cs-theme')}catch(e){}
if(t!=='light'&&t!=='dark'){t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}
document.documentElement.setAttribute('data-theme',t)})();
</script>
<style>
  :root { color-scheme: dark; --bg:#0c0c0d; --text:#f0ece4; --text-2:#888680; --accent:#b8ff57; --on-accent:#0c0c0d; --border:rgba(255,255,255,0.07); }
  :root[data-theme="light"] { color-scheme: light; --bg:#f7f7f4; --text:#16161a; --text-2:#5a5852; --accent:#31700a; --on-accent:#ffffff; --border:rgba(12,12,13,0.10); }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; margin: 0; text-align: center; padding: 1.5rem;
  }
  .code {
    font-size: clamp(3.5rem, 14vw, 6rem); font-weight: 800;
    color: var(--accent); line-height: 1; letter-spacing: -0.03em;
  }
  h1 { font-size: clamp(1.1rem, 4vw, 1.4rem); margin: 0.75rem 0 0.5rem; font-weight: 700; }
  p { color: var(--text-2); font-size: 14px; margin-bottom: 1.5rem; }
  a {
    display: inline-block; color: var(--on-accent); background: var(--accent);
    text-decoration: none; font-weight: 600; font-size: 14px;
    padding: 10px 22px; border-radius: 8px;
  }
</style>
</head>
<body>
  <div>
    <div class="code">500</div>
    <h1>Something went wrong</h1>
    <p>We hit a snag on our end. Please try again shortly.</p>
    <a href="/">Back to Home</a>
  </div>
</body>
</html>
