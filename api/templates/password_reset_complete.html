{% extends 'base.html' %}
{% load static %}
{% block title %}Password Updated — CyberSpark{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/password-reset.css' %}">
{% endblock %}
{% block content %}
<div class="pwreset-wrap">
  <div class="pwreset-card pwreset-center">
    <span class="pwreset-icon" style="margin-left:auto; margin-right:auto;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
    </span>
    <h1>Password updated</h1>
    <p>Your password has been changed. You can now sign in.</p>
    <a href="{% url 'login' %}" class="btn-primary">Sign In</a>
  </div>
</div>
{% endblock %}
